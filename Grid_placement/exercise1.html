<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Placement</title>
  <style>
    body {
      padding: 0;
      margin: 0;
    }

    .container {
      height: 100vh;
      display: grid;
      gap: 3rem;
      grid-template-columns: 1fr 1fr 1.5fr;
      grid-template-rows: 1fr 1fr;
    }

    .item {
      font-size: 5rem;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      background-color: blueviolet;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cowboy{
      background-color: rgb(4, 151, 236);
      grid-column: span 2;
      /* grid-column-start:1 ; 
      grid-column-end: 3; */
      grid-row-start:1 ;
      grid-row-end: 1;
    }
    .astronaut{
      background-color: rgb(27, 151, 189);
      grid-column: span 2;
      grid-column-start:1 ; 
      grid-column-end: 3; 
      grid-row-start:2 ;
      grid-row-end: 3;
    }
    .book{
      background-color: rgb(233, 132, 0);
      
      grid-column: 3/4;
      grid-row: 1/3;

    }
    


  </style>
</head>

<body>
  <div class="container">
    <div class="item cowboy">🤠</div>
    <div class="item astronaut">👨‍🚀</div>
    <div class="item book">📖</div>
  </div>
</body>

</html>
