<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informacije o gradovima</title>

    <style>
        .card {
            background-color: #87CEEB;
            padding: 20px;
            margin: 20px;
            border: 2px solid #333333;
            border-radius: 6px;
            position: relative; 
            width: 300px;
        }

        .card h2 {
            font-family: Arial, sans-serif;
            font-size: 24px;
        }

        .card p {
            font-family: Verdana, sans-serif;
            font-size: 16px;
            color: #333333;
        }

        .extra-info {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Informacije o gradu</h2>
        <p>Naziv: Zagreb</p>
        <p>Država: Hrvatska</p>
        <p>Populacija: 770 000</p>
        <p class="Dodatne informacije">
            <a href="https://hr.wikipedia.org/wiki/Zagreb" target="_blank">Dodatne informacije</a>
        </p>
    </div>

    <div class="card">
        <h2>Informacije o gradu</h2>
        <p>Naziv: Split</p>
        <p>Država: Hrvatska</p>
        <p>Populacija: 160 000</p>
        <p class="Dodatne informacije">
            <a href="https://hr.wikipedia.org/wiki/Split" target="_blank">Dodatne informacije</a>
        </p>
    </div>

    <div class="card">
        <h2>Informacije o gradu</h2>
        <p>Naziv: Rijeka</p>
        <p>Država: Hrvatska</p>
        <p>Populacija: 108 000</p>
        <p class="Dodatne informacije">
            <a href="https://hr.wikipedia.org/wiki/Rijeka" target="_blank">Dodatne informacije</a>
        </p>
    </div>


</body>
</html>
