<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="4. zadaća iz Web programiranja">
    <meta name="author" content="Student">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradovi</title>

    <style>
        body {
            font-family: Verdana, sans-serif;
        }

        .card {
            background-color: #87CEEB;
            border: 2px solid #333333;
            border-radius: 6px;
            padding: 20px;
            margin: 20px;
            position: relative;
            width: 300px;
            display: inline-block;
            vertical-align: top;
        }

        h2 {
            font-family: Arial, sans-serif;
            font-size: 24px;
            display: inline-block;
        }

        p {
            color: #333333;
            font-size: 16px;
        }

        .info-link {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 14px;
        }

     
        .flag {
            width: 400px;
            height: 250px;
            background-color: #006AA7;
            position: relative;
            margin: 40px auto;
        }

        .horizontal {
            position: absolute;
            top: 100px;
            width: 100%;
            height: 50px;
            background-color: #FECC00;
        }

        .vertical {
            position: absolute;
            left: 120px;
            width: 50px;
            height: 100%;
            background-color: #FECC00;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Informacije o gradu</h2>
        <p>Naziv: Zagreb</p>
        <p>Država: Hrvatska</p>
        <p>Populacija: oko 800 000</p>
        <p class="info-link">
            <a href="https://hr.wikipedia.org/wiki/Zagreb" target="_blank">Dodatne informacije</a>
        </p>
    </div>

    <div class="card">
        <h2>Informacije o gradu</h2>
        <p>Naziv: Beč</p>
        <p>Država: Austrija</p>
        <p>Populacija: oko 1 900 000</p>
        <p class="info-link">
            <a href="https://hr.wikipedia.org/wiki/Beč" target="_blank">Dodatne informacije</a>
        </p>
    </div>

    <div class="card">
        <h2>Informacije o gradu</h2>
        <p>Naziv: Berlin</p>
        <p>Država: Njemačka</p>
        <p>Populacija: oko 3 600 000</p>
        <p class="info-link">
            <a href="https://hr.wikipedia.org/wiki/Berlin" target="_blank">Dodatne informacije</a>
        </p>
    </div>

    
    <div class="flag">
        <div class="horizontal"></div>
        <div class="vertical"></div>
    </div>

</body>
</html>
